version: '3.8'

services:
  mongodb_audit:
    build: .
    container_name: btg_mongodb_audit
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: btg_audit_2025
      MONGO_INITDB_DATABASE: btg_auditoria
    volumes:
      - mongodb_audit_data:/data/db
      - mongodb_audit_configdb:/data/configdb
    networks:
      - audit_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  mongodb_audit_data:
    driver: local
  mongodb_audit_configdb:
    driver: local

networks:
  audit_network:
    driver: bridge
