services:
  db:
    build: ./database  
    container_name: btg_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: btg_db
      POSTGRES_USER: btg_user
      POSTGRES_PASSWORD: btg_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - btg_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btg_user -d btg_db"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  backend:
    build: ./backend
    container_name: btg_backend
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=db;Database=btg_db;Username=btg_user;Password=btg_pass;Port=5432
    networks:
      - btg_network
    restart: unless-stopped

  api_recomendacao:
    build: 
      context: ./recomendationAPI
      dockerfile: Dockerfile
    container_name: btg_api_recomendacao
    ports:
      - "8000:8000" 
    volumes:
      - ./recomendationAPI/data:/app/data 
    environment:
      - PYTHONPATH=/app/src
      - PYTHONUNBUFFERED=1
    networks:
      - btg_network
    restart: unless-stopped
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  mongodb_auditoria:
    image: mongo:7.0
    container_name: btg_mongodb_auditoria
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin_pass_2025
      MONGO_INITDB_DATABASE: auditoria_db
    volumes:
      - mongodb_data:/data/db
      - ./auditoria/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - btg_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  pgdata:
  mongodb_data:
  
networks:
  btg_network:
    driver: bridge