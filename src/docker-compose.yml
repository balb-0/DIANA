version: '3.9'
services:
  db:
    build: ./database
    container_name: btg_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: btg_db
      POSTGRES_USER: btg_user
      POSTGRES_PASSWORD: btg_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
  backend:
    build: ./backend
    container_name: btg_backend
    ports:
      - "5176:5176"
    depends_on:
      - db
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:5176

volumes:
  pgdata:
